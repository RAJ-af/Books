name: Build and Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Save to Test Folder
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Keystore & Secrets Environment
        run: |
          # 1. Restore or generate debug keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure .env file exists for Secrets Gradle Plugin
          touch .env

      - name: Ensure Gradle Wrapper is Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew wrapper script not found! Regenerating with gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Package and Move APK to test/ Folder
        id: package_apk
        run: |
          # Extract versionName from app/build.gradle.kts (e.g. versionName = "1.0")
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          echo "Detected Version Name: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

          # Create test directory
          mkdir -p test

          # Locate built APK
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/outputs/apk/*/*.apk" | head -n 1)
          fi

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            TARGET_APK_NAME="test/app-v${VERSION_NAME}.apk"
            cp "$APK_PATH" "$TARGET_APK_NAME"
            echo "Successfully copied APK to $TARGET_APK_NAME"
            ls -lh test/
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APK-v${{ steps.package_apk.outputs.version_name }}
          path: test/
          retention-days: 30
