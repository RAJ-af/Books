name: Build and Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Save to Test Folder
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Keystore & Secrets Environment
        run: |
          # 1. Restore or generate debug keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure .env file exists for Secrets Gradle Plugin
          touch .env

      - name: Validate and Ensure Gradle Wrapper 9.3.1
        run: |
          mkdir -p gradle/wrapper

          # Verify if gradle-wrapper.jar is a valid ZIP/JAR
          VALID_JAR=false
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            if jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
              VALID_JAR=true
              echo "Existing gradle-wrapper.jar is valid."
            else
              echo "Warning: gradle-wrapper.jar is corrupt or invalid."
            fi
          fi

          # If invalid or missing, recover from base64 or download clean 9.3.1 wrapper jar
          if [ "$VALID_JAR" = false ]; then
            if [ -f gradle/wrapper/gradle-wrapper.jar.base64 ]; then
              echo "Restoring gradle-wrapper.jar from base64..."
              base64 -d gradle/wrapper/gradle-wrapper.jar.base64 > gradle/wrapper/gradle-wrapper.jar
            fi

            # Double check if base64 restored it properly
            if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
              echo "Downloading official Gradle 9.3.1 wrapper jar..."
              curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || true
            fi
          fi

          # Ensure gradlew exists and is executable
          if [ ! -f gradlew ]; then
            echo "Regenerating wrapper scripts..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

          # Display Gradle version
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Package and Move APK to test/ Folder
        id: package_apk
        run: |
          # Extract versionName from app/build.gradle.kts (e.g. versionName = "1.0")
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          echo "Detected Version Name: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

          # Create test directory
          mkdir -p test

          # Locate built APK
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/outputs/apk/*/*.apk" | head -n 1)
          fi

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            TARGET_APK_NAME="test/app-v${VERSION_NAME}.apk"
            cp "$APK_PATH" "$TARGET_APK_NAME"
            echo "Successfully copied APK to $TARGET_APK_NAME"
            ls -lh test/
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APK-v${{ steps.package_apk.outputs.version_name }}
          path: test/
          retention-days: 30
